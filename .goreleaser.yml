version: 2

project_name: sitrep

before:
  hooks:
    - go mod tidy

builds:
  - id: sitrep
    main: ./cmd/sitrep
    binary: sitrep
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/niekcandaele/sitrep/internal/buildinfo.Version={{.Version}}
      - -X github.com/niekcandaele/sitrep/internal/buildinfo.Commit={{.ShortCommit}}
      # The commit's date, not the build's clock: stamping the latter would
      # make two builds of one commit differ, which is exactly what
      # mod_timestamp below exists to prevent. CommitDate also honours
      # SOURCE_DATE_EPOCH.
      - -X github.com/niekcandaele/sitrep/internal/buildinfo.Date={{.CommitDate}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Stamp every file with the commit's own time rather than the build's, so
    # rebuilding the same tag produces the same archive bytes.
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: sitrep
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
