version: "2"

linters:
  default: standard
  enable:
    - revive
    - misspell
    - bodyclose
    - errorlint
    - depguard
  settings:
    depguard:
      rules:
        shared-shaping-layer:
          files:
            - "**/internal/render/plain/*.go"
          deny:
            - pkg: github.com/niekcandaele/sitrep/internal/tui
              desc: "ADR-0007: the shared terminal-shaping layer must not depend on the TUI"
        thin-model:
          files:
            - "**/internal/model/*.go"
          deny:
            - pkg: github.com/niekcandaele/sitrep/internal/render/plain
              desc: "ADR-0007: the thin model must not depend on render policy"
    revive:
      rules:
        - name: exported
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/niekcandaele/sitrep

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
