version: "2"

linters:
  default: standard
  enable:
    - revive
    - misspell
    - bodyclose
    - errorlint
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/niekcandaele/sitrep

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
