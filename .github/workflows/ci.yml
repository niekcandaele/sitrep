name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'epic/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

  release-dryrun:
    name: Release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

      - name: goreleaser snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish

      - name: Verify the release matrix produced four archives
        run: |
          ls -la dist/
          archives="$(ls dist/*.tar.gz | wc -l)"
          if [ "$archives" -ne 4 ]; then
            echo "expected 4 archives in dist/, found $archives"
            exit 1
          fi
          test -f dist/checksums.txt

      # Building is not the same as working. This runs the binary the matrix
      # just produced and asserts the three things a published archive has to be
      # true about: it starts, it knows its own version, and it is static enough
      # to drop onto a headless box with no Go and no libc surprises.
      - name: Run the binary the release would publish
        run: |
          set -euo pipefail

          # goreleaser's per-target directory naming has changed across
          # versions, so find the binary rather than hard-coding a path.
          bin="$(find dist -type f -name sitrep -path '*linux*amd64*' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "no linux/amd64 sitrep binary in dist/"
            find dist -type f
            exit 1
          fi
          echo "testing $bin"

          version="$("$bin" --version)"
          echo "$version"
          case "$version" in
            "sitrep "*) ;;
            *) echo "--version did not start with 'sitrep ': $version"; exit 1 ;;
          esac
          # "dev" here would mean the ldflags path silently broke and every
          # published binary is unidentifiable in a bug report.
          case "$version" in
            *dev*) echo "--version still reports the unlinked default: $version"; exit 1 ;;
          esac

          "$bin" --help > /dev/null

          # CGO_ENABLED=0 is what makes the archive runnable on a musl box or a
          # distroless image. `file` is asserted rather than `ldd` because ldd
          # on a non-dynamic binary exits non-zero on some distributions, which
          # would mask a real failure under `set -e`.
          file "$bin"
          if ! file "$bin" | grep -q 'statically linked'; then
            echo "the published binary is not statically linked"
            exit 1
          fi
